openapi: 3.1.0
info:
  title: CompanyCentral Gateway API
  version: 0.0.0
  summary: "Public API as a browser sees it: /api/<service>/v1/... through the gateway."
  description: |
    The public contract of the gateway. The browser sends a Keycloak access token
    (`Authorization: Bearer`, audience `gateway`); the gateway verifies it, resolves the
    CompanyCentral user, replaces the token with a short-lived gateway-signed context JWT
    and forwards the request to the service's internal `/v1/...` path.

    **The contract of each service is authoritative for request and response bodies.**
    The schemas below duplicate those of `service-identity` and may lag behind them.

    Routed now: `GET /api/identity/v1/me` and `GET`/`PATCH`/`DELETE` on
    `/api/identity/v1/admin/users` and `/api/identity/v1/admin/users/{id}`; `HEAD` is served
    like `GET`. Every other `/api/<service>/v1/...` route that needs a tenant answers
    501 until company membership validation exists, and unknown paths answer 404.
    Service-to-service paths (`/v1/internal/...`) are never routed (404).

    Errors generated by the gateway are `application/problem+json` (RFC 9457) with a
    `correlationId` equal to the `X-Request-Id` response header. Errors from a service are
    passed through unchanged; an upstream 5xx without a problem document is replaced by one.
    Every response, including errors, carries `X-Request-Id`: the client's value is reused
    if it is 1-64 characters of `A-Za-z0-9._-`, otherwise the gateway generates one.

    The operational endpoints (`/health/*`, `/metrics`, `/.well-known/jwks.json`) are
    cluster-internal and not routed by the Ingress; `/api-docs` is served without a token.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: This gateway (locally http://localhost:8080)
tags:
  - name: identity
    description: Identity service, routed as `/api/identity/v1/...`.
  - name: operations
    description: Served by the gateway itself; not routed by the Ingress except `/api-docs`.
paths:
  /api/identity/v1/me:
    get:
      operationId: getMe
      summary: Current user
      description: |
        Returns the signed-in user, creating the account on the first call. This is the
        only route a user without a CompanyCentral account yet may call; elsewhere such a
        user gets 403.
      tags: [identity]
      security:
        - oidc: []
      responses:
        "200":
          description: The signed-in user.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
              example:
                id: 0192f8e0-0000-7000-8000-000000000001
                email: ana@example.com
                displayName: Ana Novak
                locale: sl
                platformRoles: [platform-admin]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /api/identity/v1/admin/users:
    get:
      operationId: listUsers
      summary: List users (platform admin)
      description: |
        Requires the `platform-admin` role (checked by the identity service).
        A deleted user keeps only the ID, locale and timestamps; personal data is erased.
      tags: [identity]
      security:
        - oidc: []
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 }, description: Matches email or name }
        - { name: status, in: query, schema: { type: string, enum: [active, deleted, all], default: active } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: One page of users.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /api/identity/v1/admin/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getUser
      summary: Get a user (platform admin)
      tags: [identity]
      security:
        - oidc: []
      responses:
        "200":
          description: The user; a deleted user has no personal data.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
    patch:
      operationId: updateUser
      summary: Edit a user (platform admin)
      description: Changes the sign-in email and names. Unknown fields are rejected.
      tags: [identity]
      security:
        - oidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                email: { type: string, format: email, maxLength: 254 }
                givenName: { type: string, minLength: 1, maxLength: 100, pattern: "\\S" }
                familyName: { type: string, minLength: 1, maxLength: 100, pattern: "\\S" }
            example: { email: ana.novak@example.com, givenName: Ana }
      responses:
        "200":
          description: The updated user.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
    delete:
      operationId: deleteUser
      summary: Delete a user (platform admin)
      description: |
        Anonymizes the user: personal data is erased, the ID stays, memberships are
        deactivated and the Keycloak account is deleted in the background. Idempotent;
        an admin cannot delete their own account (403).
      tags: [identity]
      security:
        - oidc: []
      responses:
        "204":
          description: Deleted, or already deleted.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /health/live:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: Cluster-internal; not routed by the Ingress. Never checks dependencies.
      tags: [operations]
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /health/ready:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: Cluster-internal; not routed by the Ingress. Ready when the identity provider's keys can be loaded.
      tags: [operations]
      security: []
      responses:
        "200":
          description: Ready to receive traffic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Not ready; at least one check failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics
      description: Cluster-internal; not routed by the Ingress.
      tags: [operations]
      security: []
      responses:
        "200":
          description: Metrics in the Prometheus text exposition format.
          content:
            text/plain:
              schema: { type: string }
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      summary: Public keys of the tenant context
      description: |
        Cluster-internal; not routed by the Ingress. The public ES256 key services use to
        verify the gateway-signed context JWT. Cacheable for 5 minutes.
      tags: [operations]
      security: []
      responses:
        "200":
          description: A JSON Web Key Set.
          headers:
            Cache-Control: { schema: { type: string, example: "public, max-age=300" } }
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { type: object, additionalProperties: true }
  /api-docs:
    get:
      operationId: getApiDocs
      summary: This OpenAPI document
      description: Needs no token. Returns YAML when `Accept` includes `yaml`, otherwise JSON.
      tags: [operations]
      security: []
      responses:
        "200":
          description: The OpenAPI 3.1 document of the gateway.
          content:
            application/yaml: { schema: { type: string } }
            application/json: { schema: { type: object } }
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: http://localhost:8180/realms/companycentral/.well-known/openid-configuration
      description: |
        Keycloak access token sent as `Authorization: Bearer <token>`; the audience
        must be `gateway`. The gateway replaces it with its own context JWT before forwarding.
  headers:
    XRequestId:
      description: Request ID, reused from the request when valid, otherwise generated. Also the `correlationId` of errors.
      schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" }
  responses:
    BadRequest:
      description: Invalid path, query parameters or body (from the service).
      headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Unauthorized:
      description: |
        Missing, invalid or expired access token, or the account was deleted. Carries
        `WWW-Authenticate: Bearer` (`error="invalid_token"` when a token was sent).
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        WWW-Authenticate: { schema: { type: string, example: 'Bearer error="invalid_token"' } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: about:blank, title: Unauthorized, status: 401, detail: A bearer access token is required., correlationId: 7f1c2d3e-0000-4000-8000-000000000000 }
    Forbidden:
      description: |
        The caller lacks the platform role or tries a forbidden action, or has no
        CompanyCentral account yet (call `/me` first).
      headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    NotFound:
      description: |
        No such user, or the path is not routed (unknown service or path, `/v1/internal/...`,
        encoded path delimiters).
      headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Conflict:
      description: The email belongs to another account, or the user is deleted.
      headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    PayloadTooLarge:
      description: The request body exceeds the gateway's size limit.
      headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    UnsupportedMediaType:
      description: The service rejected the content type; bodies must be `application/json`.
      headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    BadGateway:
      description: The upstream response could not be read or was too large.
      headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Unavailable:
      description: |
        The identity provider, the user lookup or the upstream service is unreachable
        (or the service itself answered 503). Retry later.
      headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    GatewayTimeout:
      description: The upstream service did not answer in time.
      headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  schemas:
    User:
      type: object
      required: [id, email, displayName, locale, platformRoles]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        locale: { type: string, enum: [sl, en] }
        platformRoles:
          type: array
          description: Platform roles, for example `platform-admin`.
          items: { type: string }
    AdminUser:
      type: object
      description: For a deleted user email and names are `null` and `deletedAt` is set.
      required: [id, status, locale, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, deleted] }
        email: { type: [string, "null"], format: email, description: "null once deleted" }
        displayName: { type: [string, "null"], description: "null once deleted" }
        givenName: { type: [string, "null"] }
        familyName: { type: [string, "null"] }
        locale: { type: string, enum: [sl, en] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, "null"], format: date-time }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, fail] }
        checks:
          type: object
          description: Result per dependency, for example `oidc`.
          additionalProperties:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [ok, fail] }
              detail: { type: string }
    Problem:
      type: object
      description: Error response (RFC 9457, `application/problem+json`). Responses generated by the gateway always carry `correlationId`.
      required: [type, title, status, correlationId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string, description: Equals the `X-Request-Id` response header }
security:
  - oidc: []
