name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: RSOcc26/.github/.github/workflows/reusable-ci.yml@main
    with:
      # Shared tenant-context schema, and identity's contract for the copied schemas
      contract-repositories: .github service-identity
    secrets: inherit

  # On main only: build the image and push it to ghcr.io/rsocc26/gateway
  publish:
    needs: checks
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: RSOcc26/.github/.github/workflows/reusable-publish.yml@main

  deploy-dev:
    needs: publish
    if: needs.publish.outputs.image != ''
    permissions:
      contents: read
      id-token: write
    uses: RSOcc26/.github/.github/workflows/reusable-deploy.yml@main
    with:
      environment: dev
