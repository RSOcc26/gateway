name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: RSOcc26/.github/.github/workflows/reusable-ci.yml@main
    with:
      # Shared tenant-context schema, and identity's contract for the copied schemas
      contract-repositories: .github service-identity
    secrets: inherit
